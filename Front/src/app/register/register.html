<body>
  <div class="register-container">

    <div class="promo-section">
      <div class="promo-overlay">
        <div class="brand">
          <div class="brand-icon">🎮</div>
          IMIRank
        </div>
        <h1>Pridružite se najvećoj zajednici gejmera i kritičara.</h1>
        <div class="stats">
          <div class="stat">
            <strong>50k+</strong>
            <span>Recenzija</span>
          </div>
          <div class="stat">
            <strong>12k+</strong>
            <span>Aktivnih igrača</span>
          </div>
          <div class="stat">
            <strong>200+</strong>
            <span>Stručnih urednika</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <form class="register-form" (ngSubmit)="onSubmit()">
        <h2>Kreirajte nalog</h2>

        <div class="field-group">
          <label for="username">Korisničko ime</label>
          <input type="text" id="username" [(ngModel)]="userName" name="username" placeholder="npr. GamingHero99" required>
        </div>

        <div class="field-group">
          <label for="email">E-mail adresa</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="ime@primjer.hr" required>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="password">Lozinka</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required>
          </div>
          <div class="field-group">
            <label for="confirmPassword">Potvrdi lozinku</label>
            <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          </div>
        </div>

        <div>
          <span class="role-label">Odaberite svoju ulogu</span>
          <div class="roles">
            <label class="role-option">
              <input type="radio" name="role" [value]="0" [(ngModel)]="role">
              <div class="role-box">
                <span class="role-icon">👤</span>
                <div class="role-text">
                  <strong>Redovni korisnik</strong>
                  <small>Čitajte, ocenjujte i komentarišite recenzije drugih igrača.</small>
                </div>
              </div>
            </label>
            <label class="role-option">
              <input type="radio" name="role" [value]="1" [(ngModel)]="role">
              <div class="role-box">
                <span class="role-icon">✏️</span>
                <div class="role-text">
                  <strong>Urednik</strong>
                  <small>Pišite i objavljujte profesionalne recenzije igara uz sve korisničke mogućnosti.</small>
                </div>
              </div>
            </label>
          </div>
        </div>

        @if (error) {
          <p class="error-msg">{{ error }}</p>
        }

        <button type="submit" class="btn-primary">Registrujte se &rarr;</button>
        <p class="login-link">Već imate nalog? <a href="/login">Prijavite se</a></p>
      </form>
    </div>

  </div>
</body>
