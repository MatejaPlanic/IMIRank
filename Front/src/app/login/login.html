<body>
  <div class="register-container">

    <div class="promo-section">
      <div class="promo-overlay">
        <div class="brand">
          <div class="brand-icon">🎮</div>
          IMIRank
        </div>
        <h1>Dobrodošli nazad</h1>
        <div class="stats">
          <div class="stat">
            <strong>50k+</strong>
            <span>Recenzija</span>
          </div>
          <div class="stat">
            <strong>12k+</strong>
            <span>Aktivnih igrača</span>
          </div>
          <div class="stat">
            <strong>200+</strong>
            <span>Stručnih urednika</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="login-form-wrap">

        <div class="welcome-icon">🎮</div>
        <h2>Prijavite se</h2>
        <p class="subtitle">Unesite svoje podatke da biste nastavili</p>

        <form (ngSubmit)="onSubmit()">
          <div class="field-group">
            <label for="email">E-mail adresa</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="ime@primer.com" required>
          </div>

          <div class="field-group">
            <label for="password">Lozinka</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
          </div>

          <div class="forgot-row">
            <a href="/forgot-password">Zaboravili ste lozinku?</a>
          </div>

          @if (error) {
            <p class="error-msg">{{ error }}</p>
          }

          <button type="submit" class="btn-primary">Prijavite se &rarr;</button>
        </form>

        <div class="divider"><span>nemate nalog?</span></div>

        <div class="register-cta">
          <p>
            <strong>Pridružite se zajednici</strong>
            Besplatno kreirajte nalog i počnite odmah.
          </p>
          <a href="/register" class="btn-outline">Registrujte se</a>
        </div>

      </div>
    </div>

  </div>
</body>
